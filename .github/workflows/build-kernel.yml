# Build Satetsu Shigure - GKI 5.10 for Infinix Hot 50 4G (X6882 / MT6789)
#
# Source is a pristine AOSP ACK android12-5.10-lts tree, fetched as an
# exact-commit tarball (see ACK_COMMIT). This repository is a control plane:
# only this workflow, arch/arm64/configs/performance.fragment, patches/ and
# abi/ are used. The kernel tree checked in here is the old Zenithed base and
# is NOT built -- its 260 patched files change struct layouts and broke the
# vendor ABI (814 CRC mismatches, module_layout 0x1da8fe35 vs 0x7c24b32d).
#
# Why pristine ACK: the device's own kernel ABI (android/abi_gki_aarch64.xml
# in the ACK tree) matches the 186 vendor modules' CRCs on 1397/1397
# overlapping symbols, and a plain gki_defconfig build of that tree reproduces
# them exactly. The KMI is frozen, so 5.10.274 exports the same CRCs the
# vendor 5.10.226 kernel did.
#
# Per run this produces:
#   Satetsu-Shigure-X6882-GKI510-v5.10-satetsu-<UTC>.zip   AnyKernel3
#   <zip>.sha256
#   out/arch/arm64/boot/Image
#   out/vmlinux.symvers    -> knowledge/check_vendor_crcs.sh
#   build.log

name: Build Satetsu Shigure GKI 5.10

on:
  workflow_dispatch:
  push:
    tags:
      - 'v5.10-satetsu*'

permissions:
  contents: write

env:
  # Pinned ACK commit: "Merge 5.10.274 into android12-5.10-lts".
  # The tarball URL accepts a commit id, so the build cannot drift when the
  # branch moves.
  ACK_REPO: https://android.googlesource.com/kernel/common
  ACK_COMMIT: c5acf8d66b6c3d1957c3bbf410370e06a68a6f40
  ACK_VERSION: '5.10.274'
  EXPECTED_MODULE_LAYOUT: '0x7c24b32d'

jobs:
  build:
    name: Image (arm64, ThinLTO + CFI)
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      KBUILD_BUILD_USER: hiruko
      KBUILD_BUILD_HOST: Sunagakure
      # The kernel is built OUTSIDE $GITHUB_WORKSPACE on purpose.
      # actions/checkout creates a .git at the workspace root, and
      # scripts/setlocalversion walks *up* from the tree it is given: run 13
      # produced "5.10.274-android12-9-Satetsu-Shigure-gfb992a207187" because
      # the build tree was src/ inside that repo. /home/runner/kernel has no
      # repository above it, so the release is exactly
      # KERNELVERSION + CONFIG_LOCALVERSION, with no -g<sha> and no -dirty.
      KSRC: /home/runner/kernel

    steps:
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/share/swift /opt/microsoft /usr/local/aws-cli
          sudo apt-get clean
          df -h /

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu bc bison flex \
            libelf-dev libssl-dev python3 cpio rsync zip unzip xz-utils zstd \
            patch
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Record toolchain
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          clang --version
          ld.lld --version
          make --version | head -n1
          echo "target: $(clang --target=aarch64-linux-gnu -dumpmachine)"
          echo "cross elfedit: $(command -v aarch64-linux-gnu-elfedit || echo MISSING)"
          echo "cpus: $(nproc)"
          df -h /

      - name: Checkout control files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch pristine ACK source
        run: |
          set -euo pipefail
          url="${ACK_REPO}/+archive/${ACK_COMMIT}.tar.gz"
          echo "fetching $url"
          curl -fsSL --retry 3 -o ack.tar.gz "$url"
          echo "tarball bytes: $(stat -c%s ack.tar.gz)"
          mkdir -p "$KSRC"
          tar -xzf ack.tar.gz -C "$KSRC"
          rm -f ack.tar.gz

          got="$(make -s -C "$KSRC" kernelversion)"
          echo "source version: $got (expected ${ACK_VERSION})"
          [[ "$got" == "${ACK_VERSION}" ]] || {
            echo "FAIL: tarball is not ${ACK_VERSION}"; exit 1; }

          # Guard the release string: setlocalversion only stays silent when no
          # git repository is reachable from the build tree.
          if top="$(git -C "$KSRC" rev-parse --show-toplevel 2>/dev/null)"; then
            echo "FAIL: git repository visible from $KSRC at $top"
            exit 1
          fi
          echo "no SCM above $KSRC: release string will be clean"

          cp arch/arm64/configs/performance.fragment "$KSRC/arch/arm64/configs/"
          cp arch/arm64/configs/droidspaces_desktop.fragment "$KSRC/arch/arm64/configs/"
          cp arch/arm64/configs/usb_extras.fragment "$KSRC/arch/arm64/configs/"
          cp arch/arm64/configs/ux_polish.fragment "$KSRC/arch/arm64/configs/"
          cp -r abi "$KSRC/"
          shopt -s nullglob
          patch_list=(patches/*.patch)
          [[ ${#patch_list[@]} -ge 1 ]] || { echo "FAIL: no patches found"; exit 1; }
          for p in "${patch_list[@]}"; do
            echo "applying $p"
            patch -p1 -d "$KSRC" < "$p"
          done

          # The tree has no .git, so scripts/setlocalversion emits nothing:
          # no -dirty, no -g<sha>, and MODULE_SCMVERSION simply omits the
          # attribute. That is why the release string is reproducible.
          grep -n -A4 '^config STACKPROTECTOR_PER_TASK' "$KSRC/arch/arm64/Kconfig"

      - name: Configure
        working-directory: ${{ env.KSRC }}
        run: |
          set -euo pipefail
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/performance.fragment \
            arch/arm64/configs/droidspaces_desktop.fragment \
            arch/arm64/configs/usb_extras.fragment \
            arch/arm64/configs/ux_polish.fragment
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Assert ABI-critical config
        working-directory: ${{ env.KSRC }}
        run: |
          set -euo pipefail
          echo "=== toolchain as Kconfig sees it ==="
          clang --version | head -n2
          ld.lld --version
          llvm-nm --version 2>/dev/null | head -n1
          echo "=== LTO / compiler symbols in out/.config ==="
          grep -E 'CONFIG_(LTO|CC_IS_CLANG|LD_IS_LLD|HAS_LTO|CLANG_VERSION)' out/.config \
            || echo "(no LTO symbols at all)"
          echo "=== config size: $(wc -l < out/.config) lines ==="
          check() {
            grep -qx "$1" out/.config || {
              echo "FAIL: expected '$1'"
              grep -E "^${1%%=*}=" out/.config || echo "  (symbol absent)"
              exit 1
            }
          }
          # Mandatory spec flags.
          check 'CONFIG_LTO_CLANG_THIN=y'
          check 'CONFIG_PREEMPT=y'
          check 'CONFIG_HZ=300'
          check 'CONFIG_CRYPTO_LZ4=y'
          check 'CONFIG_NET_SCH_FQ=y'
          check 'CONFIG_TCP_CONG_BBR=y'
          check 'CONFIG_DEFAULT_TCP_CONG="bbr"'
          check 'CONFIG_MODVERSIONS=y'
          check 'CONFIG_MODULE_SCMVERSION=y'
          # ABI-critical: must match the stock kernel the modules were built
          # against. See the header of performance.fragment.
          check 'CONFIG_KASAN=y'
          check 'CONFIG_KASAN_HW_TAGS=y'
          check 'CONFIG_TRANSPARENT_HUGEPAGE=y'
          check 'CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y'
          check 'CONFIG_LOCALVERSION_AUTO=y'
          check 'CONFIG_LOCALVERSION="-android12-9-Satetsu-Shigure"'
          # Module loading.
          check 'CONFIG_MODULE_UNLOAD=y'
          check 'CONFIG_MODULE_FORCE_LOAD=y'
          check 'CONFIG_CFI_CLANG=y'
          check 'CONFIG_SHADOW_CALL_STACK=y'

          # --- feat/droidspaces-desktop: container support, all built in ---
          # Anything resolving to =m would be unloadable payload: boot.img
          # cannot carry extra modules, so these must all be =y.
          for sym in NAMESPACES PID_NS UTS_NS IPC_NS SYSVIPC POSIX_MQUEUE \
                     DEVTMPFS TMPFS_XATTR TMPFS_POSIX_ACL \
                     NETFILTER_ADVANCED NETFILTER_XT_MATCH_ADDRTYPE MACVLAN \
                     IP6_NF_IPTABLES IP6_NF_FILTER IP6_NF_MANGLE IP6_NF_NAT \
                     IP6_NF_TARGET_MASQUERADE; do
            check "CONFIG_${sym}=y"
          done

          # Measured ABI breaks and the user-mandated exclusions.
          # CGROUP_DEVICE resizes struct css_set (CGROUP_SUBSYS_COUNT);
          # NF_TABLES and BRIDGE_NETFILTER both add members to struct net.
          # Each one shifts vendor CRCs; see droidspaces_desktop.fragment.
          for bad in CGROUP_DEVICE NF_TABLES BRIDGE_NETFILTER \
                     USER_NS CFS_BANDWIDTH CGROUP_PIDS DEVTMPFS_MOUNT; do
            if grep -qx "CONFIG_${bad}=y" out/.config; then
              echo "FAIL: ${bad} must not be enabled"
              exit 1
            fi
          done

          # --- feat/usb-extras: gadget configfs + host classes, all built in ---
          for sym in USB_GADGET USB_CONFIGFS USB_CONFIGFS_F_HID \
                     USB_CONFIGFS_MASS_STORAGE USB_CONFIGFS_NCM \
                     USB_CONFIGFS_ECM USB_CONFIGFS_ACM USB_CONFIGFS_F_UVC \
                     USB_CONFIGFS_F_UAC2 USB_ACM USB_SERIAL USB_SERIAL_GENERIC \
                     USB_SERIAL_CH341 USB_SERIAL_CP210X USB_SERIAL_FTDI_SIO \
                     USB_SERIAL_PL2303 USB_STORAGE USB_UAS USB_USBNET \
                     USB_NET_CDCETHER USB_NET_CDC_NCM USB_RTL8152 \
                     USB_NET_AX88179_178A USB_VIDEO_CLASS SND_USB_AUDIO \
                     HID HIDRAW USB_HIDDEV USB_MON; do
            check "CONFIG_${sym}=y"
          done
          for bad in USB_GADGET_DEBUG USB_GADGET_DEBUG_FILES USB_GADGET_VERBOSE; do
            if grep -qx "CONFIG_${bad}=y" out/.config; then
              echo "FAIL: ${bad} must not be enabled"
              exit 1
            fi
          done

          # --- feat/usb-extras: ux_polish, filesystems and TTL mangling ---
          for sym in ISO9660_FS JOLIET ZISOFS UDF_FS BTRFS_FS \
                     BTRFS_FS_POSIX_ACL NETFILTER_XT_TARGET_HL \
                     IP_NF_TARGET_TTL IP6_NF_TARGET_HL; do
            check "CONFIG_${sym}=y"
          done
          # Already =y in gki_defconfig; asserted so a base bump cannot lose them.
          for sym in MQ_IOSCHED_KYBER IOSCHED_BFQ EXFAT_FS WIREGUARD \
                     RCU_FAST_NO_HZ NETFILTER_XT_TARGET_TCPMSS; do
            check "CONFIG_${sym}=y"
          done
          for bad in FUNCTION_TRACER STACK_TRACER SLUB_DEBUG_ON ZRAM; do
            if grep -qx "CONFIG_${bad}=y" out/.config; then
              echo "FAIL: ${bad} must not be enabled"
              exit 1
            fi
          done

          for bad in CONFIG_LTO_CLANG_FULL \
                     CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS \
                     CONFIG_TRANSPARENT_HUGEPAGE_LEGACY_SYSFS \
                     CONFIG_MODULE_SIG \
                     CONFIG_TRIM_UNUSED_KSYMS \
                     CONFIG_STACKPROTECTOR_PER_TASK; do
            if grep -qx "${bad}=y" out/.config; then
              echo "FAIL: ${bad} must not be enabled"
              exit 1
            fi
          done
          echo "config assertions: OK"

      - name: Dump resolved container config
        working-directory: ${{ env.KSRC }}
        run: |
          set -euo pipefail
          # Recorded verbatim in the run log: this is the config the Image was
          # actually built with, not the fragment as written.
          echo "=== resolved out/.config: droidspaces-desktop surface ==="
          grep -E '^(CONFIG_(NAMESPACES|PID_NS|UTS_NS|IPC_NS|SYSVIPC|POSIX_MQUEUE|DEVTMPFS|DEVTMPFS_MOUNT|TMPFS_XATTR|TMPFS_POSIX_ACL|NETFILTER_ADVANCED|NETFILTER_XT_MATCH_ADDRTYPE|MACVLAN|IP6_NF_IPTABLES|IP6_NF_FILTER|IP6_NF_MANGLE|IP6_NF_NAT|IP6_NF_TARGET_MASQUERADE|CGROUP_DEVICE|NF_TABLES|BRIDGE_NETFILTER|USER_NS|CFS_BANDWIDTH|CGROUP_PIDS|NF_CONNTRACK_NETLINK)=|# CONFIG_(DEVTMPFS_MOUNT|CGROUP_DEVICE|NF_TABLES|BRIDGE_NETFILTER|USER_NS|CFS_BANDWIDTH|CGROUP_PIDS|NF_CONNTRACK_NETLINK) is not set)' \
            out/.config | sort
          echo "=== resolved out/.config: usb extras + ux polish ==="
          grep -E '^(CONFIG_(USB_SERIAL|USB_SERIAL_GENERIC|USB_SERIAL_CH341|USB_SERIAL_CP210X|USB_SERIAL_FTDI_SIO|USB_SERIAL_PL2303|USB_MON|USB_GADGET|USB_CONFIGFS|USB_CONFIGFS_F_HID|USB_CONFIGFS_MASS_STORAGE|USB_CONFIGFS_NCM|USB_CONFIGFS_ECM|USB_CONFIGFS_ACM|USB_CONFIGFS_F_UVC|USB_CONFIGFS_F_UAC2|USB_ACM|USB_STORAGE|USB_UAS|USB_USBNET|USB_NET_CDCETHER|USB_NET_CDC_NCM|USB_RTL8152|USB_NET_AX88179_178A|USB_VIDEO_CLASS|SND_USB_AUDIO|HID|HIDRAW|USB_HIDDEV|ISO9660_FS|JOLIET|ZISOFS|UDF_FS|BTRFS_FS|BTRFS_FS_POSIX_ACL|NETFILTER_XT_TARGET_HL|IP_NF_TARGET_TTL|IP6_NF_TARGET_HL|MQ_IOSCHED_KYBER|IOSCHED_BFQ|EXFAT_FS|WIREGUARD|RCU_FAST_NO_HZ)=|# CONFIG_(USB_GADGET_DEBUG|USB_GADGET_DEBUG_FILES|FUNCTION_TRACER|STACK_TRACER|SLUB_DEBUG_ON) is not set)' \
            out/.config | sort
          echo "=== unchanged ABI anchors ==="
          grep -E '^(CONFIG_(LTO_CLANG_THIN|LTO_CLANG_FULL|MODVERSIONS|MODULE_SCMVERSION|CFI_CLANG|SHADOW_CALL_STACK|KASAN|KASAN_HW_TAGS|PREEMPT|HZ|CRYPTO_LZ4|TRANSPARENT_HUGEPAGE|TRANSPARENT_HUGEPAGE_MADVISE|ANDROID_KABI_RESERVE|ANDROID_VENDOR_HOOKS|ANDROID_VENDOR_OEM_DATA|LOCALVERSION)=|# CONFIG_(LTO_CLANG_FULL|TRANSPARENT_HUGEPAGE_ALWAYS) is not set)' \
            out/.config | sort

      - name: Preflight vendor CRC spot-check
        working-directory: ${{ env.KSRC }}
        run: |
          set -euo pipefail
          # Cheap early warning, before the 40-minute LTO link: these four
          # objects cover every struct the container options can reach --
          # task_struct (fork.c), pid_namespace (pid.c), net (net_namespace.c)
          # and user_struct (user.c). A defect here fails in ~15 seconds
          # instead of after the full build.
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" net/core/net_namespace.o kernel/fork.o \
            kernel/pid.o kernel/user.o \
            drivers/usb/core/usb.o drivers/usb/core/hcd.o \
            drivers/usb/core/message.o drivers/usb/core/driver.o \
            drivers/usb/gadget/udc/core.o drivers/net/usb/usbnet.o
          python3 - <<'PY'
          import os
          import re
          import sys

          # kbuild writes __crc_<sym> = 0x...; next to each object under O=,
          # because ThinLTO links the .o.symversions files in at the end.
          OBJDIR = "out"
          OBJS = ("net/core/net_namespace.o", "kernel/fork.o",
                  "kernel/pid.o", "kernel/user.o",
                  "drivers/usb/core/usb.o", "drivers/usb/core/hcd.o",
                  "drivers/usb/core/message.o", "drivers/usb/core/driver.o",
                  "drivers/usb/gadget/udc/core.o", "drivers/net/usb/usbnet.o")
          # kernel/user.o exports nothing the vendor imports; it is compiled
          # only as a witness for struct user_struct.
          MIN_CHECKED = 51

          want = {}
          with open("abi/x6882_kernel_required.tsv") as fh:
              for line in fh:
                  if line.startswith("#") or not line.strip():
                      continue
                  parts = line.rstrip("\n").split("\t")
                  if len(parts) >= 2:
                      want[parts[0]] = parts[1]

          checked = bad = 0
          for obj in OBJS:
              path = os.path.join(OBJDIR, obj + ".symversions")
              n = 0
              for line in open(path):
                  m = re.match(r"__crc_(\w+) = (0x[0-9a-f]+);", line.strip())
                  if not m or m.group(1) not in want:
                      continue
                  n += 1
                  checked += 1
                  if int(m.group(2), 16) != int(want[m.group(1)], 16):
                      bad += 1
                      print("MISMATCH %-40s got %s want %s"
                            % (m.group(1), m.group(2), want[m.group(1)]))
              print("%-28s %d vendor symbols" % (obj, n))
          print("preflight: checked=%d mismatch=%d" % (checked, bad))
          if checked < MIN_CHECKED:
              print("FAIL: only %d symbols checked, expected at least %d"
                    % (checked, MIN_CHECKED))
              sys.exit(1)
          sys.exit(1 if bad else 0)
          PY

      - name: Upload failing config
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-config
          if-no-files-found: ignore
          path: |
            ${{ env.KSRC }}/out/.config
            ${{ env.KSRC }}/build.log

      - name: Build Image
        working-directory: ${{ env.KSRC }}
        run: |
          set -euo pipefail
          # -k keeps going after an error so one run reports every remaining
          # problem instead of only the first one.
          make -k O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image 2>&1 | tee build.log

      - name: Verify release string
        working-directory: ${{ env.KSRC }}
        run: |
          set -euo pipefail
          rel="$(make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tail -n1)"
          echo "kernelrelease: $rel"
          # Spec: 5.10.xxx-android12-9<KERNEL_NAME>, never -dirty, never -g<sha>.
          expected="${ACK_VERSION}-android12-9-Satetsu-Shigure"
          echo "=== out/include/generated/utsrelease.h ==="
          cat out/include/generated/utsrelease.h
          grep -qx "#define UTS_RELEASE \"$expected\"" out/include/generated/utsrelease.h || {
            echo "FAIL: utsrelease.h does not hold $expected"
            exit 1
          }
          if [[ "$rel" != "$expected" ]]; then
            echo "FAIL: expected '$expected', got '$rel'"
            case "$rel" in
              *-dirty) echo "hint: tracked files in the source tree were modified" ;;
              *-g*)    echo "hint: setlocalversion found a git repository above $KSRC" ;;
            esac
            exit 1
          fi
          echo "release string: OK"
          test -s out/arch/arm64/boot/Image
          ls -l out/arch/arm64/boot/Image
          echo "RELEASE=$rel" >> "$GITHUB_ENV"

      - name: Verify vendor ABI
        working-directory: ${{ env.KSRC }}
        run: |
          set -euo pipefail
          # `make Image` links vmlinux, and link-vmlinux.sh runs modpost with
          # MODPOST_VMLINUX=1, which writes vmlinux.symvers. Module.symvers is
          # only produced by a modules build, which this job does not do.
          set +e
          python3 abi/abi_gate.py \
            out/vmlinux.symvers \
            abi/x6882_kernel_required.tsv \
            android/abi_gki_aarch64.xml \
            "$EXPECTED_MODULE_LAYOUT" 2>&1 | tee "$KSRC/abi_gate.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "abi_gate.py exit code: $rc"
          exit "$rc"

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          utc="$(date -u +%Y%m%dT%H%M%SZ)"
          zip="Satetsu-Shigure-X6882-GKI510-v5.10-satetsu-${utc}.zip"
          git clone --depth=1 -b android12-5.10 \
            https://github.com/XTENSEI/GrayRavens-anykernel.git ak3
          sed -i 's|^kernel.string=.*|kernel.string=Satetsu Shigure GKI 5.10 by Hiruko|' ak3/anykernel.sh
          # The upstream banner still says GRAYRAVENS; the project banner is
          # "Satetsu Shigure GKI 5.10 by Hiruko" (kernel.string above, and the
          # flash-time ui_print block here).
          sed -i 's|^ui_print "  G R A Y R A V E N S"$|ui_print "  S A T E T S U   S H I G U R E"|' \
            ak3/anykernel.sh
          sed -i 's|^ui_print "  G K I   K E R N E L"$|ui_print "  G K I   5 . 1 0"|' \
            ak3/anykernel.sh
          grep -q 'S A T E T S U' ak3/anykernel.sh || {
            echo "FAIL: recovery banner was not rebranded"; exit 1; }
          grep -q '^kernel.string=Satetsu Shigure GKI 5.10 by Hiruko$' ak3/anykernel.sh || {
            echo "FAIL: kernel.string was not rebranded"; exit 1; }
          # Ship gzip, matching the stock boot payload exactly: backup_v1379/
          # boot.img is header v4 with the kernel at offset 4096 starting
          # "1f 8b 08". AnyKernel3 hands whichever file it finds straight to
          # `magiskboot repack`, which does not recompress, so a raw Image
          # would silently change the boot format.
          gzip -9 -n -c "$KSRC/out/arch/arm64/boot/Image" > ak3/Image.gz
          test ! -e ak3/Image
          raw="$(sha256sum "$KSRC/out/arch/arm64/boot/Image" | cut -d' ' -f1)"
          gz="$(gzip -dc ak3/Image.gz | sha256sum | cut -d' ' -f1)"
          [[ "$raw" == "$gz" ]] || { echo "FAIL: Image.gz does not round-trip"; exit 1; }
          echo "kernel payload: Image.gz $(stat -c%s ak3/Image.gz) bytes (raw $raw)"
          rm -rf ak3/.git ak3/.github ak3/README.md
          ( cd ak3 && zip -r9 "../${zip}" . -x '*.git*' )
          sha256sum "$zip" > "${zip}.sha256"
          cat "${zip}.sha256"
          echo "ZIP=${zip}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: satetsu-shigure-gki510
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/${{ env.ZIP }}
            ${{ github.workspace }}/${{ env.ZIP }}.sha256
            ${{ env.KSRC }}/out/arch/arm64/boot/Image
            ${{ env.KSRC }}/out/vmlinux.symvers
            ${{ env.KSRC }}/build.log

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v5.10-satetsu')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "GKI 5.10 kernel for the Infinix Hot 50 4G (X6882 / MT6789)."
            echo "Droidspaces desktop containers, USB gadget/host extras and the"
            echo "UX polish fragments, all built in."
            echo
            echo "Built from \`${GITHUB_SHA}\` on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "### Provenance"
            echo
            echo "- kernelrelease: \`${RELEASE}\`"
            echo "- ACK source: \`${ACK_COMMIT}\` (${ACK_VERSION})"
            echo "- module_layout: \`$(awk '$2=="module_layout"{print $1}' "$KSRC/out/vmlinux.symvers")\`"
            echo "- Image bytes: $(stat -c%s "$KSRC/out/arch/arm64/boot/Image")"
            echo "- Image.gz bytes: $(stat -c%s "$KSRC/out/arch/arm64/boot/Image.gz")"
            echo
            echo "### Vendor ABI"
            echo
            echo '\`\`\`'
            cat "$KSRC/abi_gate.txt"
            echo '\`\`\`'
            echo
            echo "### What is enabled"
            echo
            echo "- Containers: mount/pid/uts/ipc/net namespaces, SYSVIPC, POSIX"
            echo "  mqueue, devtmpfs, tmpfs xattr/ACL, overlayfs, macvlan, IPv6 NAT,"
            echo "  cgroup v2 base."
            echo "- USB gadget configfs: HID, mass storage, NCM, ECM, ACM, UVC, UAC2."
            echo "- USB host: serial bridges (CH341, CP210x, FTDI, PL2303, generic),"
            echo "  UAS, CDC ethernet, RTL8152, AX88179, UVC, USB audio, raw HID, usbmon."
            echo "- UX: kyber + BFQ schedulers, exFAT, Btrfs, ISO9660/Joliet/zisofs,"
            echo "  UDF, WireGuard, TTL/hop-limit and TCPMSS targets, RCU_FAST_NO_HZ."
            echo
            echo "### Deliberately not enabled"
            echo
            echo "- USER_NS, CGROUP_DEVICE, NF_TABLES, BRIDGE_NETFILTER: each one moves"
            echo "  vendor CRCs. The measured deltas are in the fragment headers."
            echo "- USB_DEBUG / USB_GADGET_DEBUG: KMI-breaking debug fields."
            echo
            echo "### Verify before flashing"
            echo
            echo '\`\`\`'
            echo "sha256sum -c ${ZIP}.sha256"
            echo '\`\`\`'
            echo
            echo "ABI-verified against all 1,395 required vendor CRCs and the full"
            echo "7,298-symbol KMI. Not boot-tested by the builder: keep a boot"
            echo "partition backup."
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "$ZIP" "$ZIP.sha256" \
            "$KSRC/out/arch/arm64/boot/Image" \
            "$KSRC/out/arch/arm64/boot/Image.gz" \
            "$KSRC/out/vmlinux.symvers" \
            "$KSRC/build.log" \
            --title "Satetsu Shigure (GKI 5.10 - X6882)" \
            --notes-file release-notes.md

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ env.KSRC }}/out/.config
            ${{ env.KSRC }}/out/vmlinux.symvers
            ${{ env.KSRC }}/build.log
