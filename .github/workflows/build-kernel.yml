# Build Satetsu Shigure - GKI 5.10 for Infinix Hot 50 4G (X6882 / MT6789)
#
# Runs on an x86_64 Linux host, which is the platform the AOSP kernel build
# system and arch/arm64/configs/gki_defconfig are written for. This supersedes
# the local aarch64/Termux attempt, which could not survive PRoot futex faults.
#
# Per run this produces:
#   Satetsu-Shigure-X6882-GKI510-v5.10-satetsu-<UTC>.zip   AnyKernel3, ready to flash
#   <zip>.sha256
#   out/arch/arm64/boot/Image
#   out/Module.symvers    -> feed to knowledge/check_vendor_crcs.sh for the
#                            full 2,462-symbol vendor ABI gate
#   build.log

name: Build Satetsu Shigure GKI 5.10

on:
  workflow_dispatch:
  push:
    tags:
      - 'v5.10-satetsu*'

permissions:
  contents: write

jobs:
  build:
    name: Image (arm64, ThinLTO + CFI)
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      KBUILD_BUILD_USER: hiruko
      KBUILD_BUILD_HOST: Sunagakure
      EXPECTED_MODULE_LAYOUT: '0x7c24b32d'

    steps:
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/share/swift /opt/microsoft /usr/local/aws-cli
          sudo apt-get clean
          df -h /

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu bc bison flex \
            libelf-dev libssl-dev python3 cpio rsync zip unzip xz-utils zstd
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Record toolchain
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          clang --version
          ld.lld --version
          make --version | head -n1
          echo "target: $(clang --target=aarch64-linux-gnu -dumpmachine)"
          echo "cross elfedit: $(command -v aarch64-linux-gnu-elfedit || echo MISSING)"
          echo "cpus: $(nproc)"
          df -h /

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure
        run: |
          set -euo pipefail
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/performance.fragment
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Assert ABI-critical config
        run: |
          set -euo pipefail
          echo "=== toolchain as Kconfig sees it ==="
          clang --version | head -n2
          ld.lld --version
          llvm-nm --version 2>/dev/null | head -n1
          echo "CC=${CC:-<unset>} LD=${LD:-<unset>} NM=${NM:-<unset>}"
          echo "=== LTO / compiler symbols in out/.config ==="
          grep -E 'CONFIG_(LTO|CC_IS_CLANG|LD_IS_LLD|HAS_LTO|CLANG_VERSION)' out/.config \
            || echo "(no LTO symbols at all)"
          echo "=== HAS_LTO_CLANG shell probes ==="
          for tool in llvm-nm llvm-ar; do
            echo "$tool --help[1]: $($tool --help 2>&1 | head -n1)"
          done
          echo "=== remaining HAS_LTO_CLANG deps in out/.config ==="
          grep -E 'CONFIG_(ARCH_SUPPORTS_LTO|FTRACE_MCOUNT_USE_RECORDMCOUNT|KASAN|GCOV_KERNEL|SHADOW_CALL_STACK|CC_HAVE_SHADOW_CALL_STACK|DYNAMIC_FTRACE|FUNCTION_GRAPH_TRACER|FTRACE=|CFI_CLANG)' out/.config \
            || echo "(none of these deps present in config)"
          echo "=== config size: $(wc -l < out/.config) lines ==="
          check() {
            grep -qx "$1" out/.config || {
              echo "FAIL: expected '$1'"
              grep -E "^${1%%=*}=" out/.config || echo "  (symbol absent)"
              exit 1
            }
          }
          check 'CONFIG_LTO_CLANG_THIN=y'
          check 'CONFIG_CFI_CLANG=y'
          check 'CONFIG_SHADOW_CALL_STACK=y'
          check 'CONFIG_MODVERSIONS=y'
          check 'CONFIG_MODULE_SCMVERSION=y'
          check 'CONFIG_MODULE_FORCE_LOAD=y'
          check 'CONFIG_MODULE_UNLOAD=y'
          check 'CONFIG_KALLSYMS_ALL=y'
          check 'CONFIG_KPROBES=y'
          check 'CONFIG_PREEMPT=y'
          check 'CONFIG_HZ=300'
          check 'CONFIG_TCP_CONG_BBR=y'
          check 'CONFIG_DEFAULT_BBR=y'
          check 'CONFIG_NET_SCH_FQ=y'
          check 'CONFIG_CRYPTO_LZ4=y'
          check 'CONFIG_ANDROID_KABI_RESERVE=y'
          check 'CONFIG_KASAN=y'
          check 'CONFIG_KASAN_HW_TAGS=y'

          for bad in CONFIG_LTO_CLANG_FULL CONFIG_TRANSPARENT_HUGEPAGE CONFIG_MODULE_SIG CONFIG_STACKPROTECTOR_PER_TASK; do
            if grep -qx "${bad}=y" out/.config; then
              echo "FAIL: ${bad} must not be enabled"
              exit 1
            fi
          done
          echo "config assertions: OK"

      - name: Upload failing config
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-config
          if-no-files-found: ignore
          path: |
            out/.config
            build.log

      - name: Build Image
        run: |
          set -euo pipefail
          # -k keeps going after an error so one run reports every remaining
          # problem instead of only the first one.
          make -k O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image 2>&1 | tee build.log

      - name: Verify release string
        run: |
          set -euo pipefail
          rel="$(make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tail -n1)"
          echo "kernelrelease: $rel"
          # Spec: 5.10.xxx-android12-9<KERNEL_NAME>, never -dirty.
          if [[ ! "$rel" =~ ^5\.10\.[0-9]+-android12-9-Satetsu-Shigure$ ]]; then
            echo "FAIL: release string violates the required form"
            exit 1
          fi
          test -s out/arch/arm64/boot/Image
          ls -l out/arch/arm64/boot/Image
          echo "RELEASE=$rel" >> "$GITHUB_ENV"

      - name: Verify vendor ABI
        run: |
          set -euo pipefail
          # `make Image` links vmlinux, and link-vmlinux.sh runs modpost with
          # MODPOST_VMLINUX=1, which writes vmlinux.symvers. Module.symvers is
          # only produced by a modules build, which this job does not do.
          symvers=out/vmlinux.symvers
          ref=abi/x6882_kernel_required.tsv
          for f in "$symvers" "$ref"; do
            if [[ ! -s "$f" ]]; then
              echo "FAIL: $f is missing"
              ls -l out/*.symvers 2>/dev/null || echo "(no *.symvers in out/)"
              exit 1
            fi
          done

          want=$(grep -vc '^#' "$ref" || true)
          echo "kernel exports: $(wc -l < "$symvers")"
          echo "kernel-required vendor imports: $want"
          echo "of the 2462 vendor imports, $((2462 - want)) are provided by the"
          echo "vendor_dlkm and vendor_boot modules themselves, not by the kernel."

          # vmlinux.symvers columns: CRC <TAB> symbol <TAB> module <TAB> export
          # reference columns:       symbol <TAB> expected CRC
          #
          # FAIL only on a symbol the kernel does not export at all: that is an
          # unresolved symbol at module load time and nothing can recover it.
          #
          # A CRC mismatch is NOT fatal. The stock ABI is produced by MediaTek's
          # patched 5.10.226 tree, which is not this source base, so struct-tag
          # CRCs cannot match by construction. CONFIG_MODULE_FORCE_LOAD=y makes
          # the kernel accept each mismatch with a warning and a force-load
          # taint -- the same mechanism the GrayRavens-Zenithed kernel that
          # already runs on this device relies on. The match count is reported
          # as a metric so a regression is visible.
          awk -F'\t' '
            /^#/ { next }
            FNR==NR { want[$1]=$2; next }
            { have[$2]=$1 }
            END {
              total=0; ok=0; bad=0; miss=0
              for (s in want) {
                total++
                if (!(s in have)) {
                  miss++
                  printf "MISSING   %-42s expected %s\n", s, want[s]
                } else if (tolower(have[s])==tolower(want[s])) {
                  ok++
                } else {
                  bad++
                  if (bad<=20) printf "MISMATCH  %-42s expected %s got %s\n", s, want[s], have[s]
                }
              }
              printf "SUMMARY kernel-required=%d crc_ok=%d crc_mismatch=%d missing=%d\n", total, ok, bad, miss
              if (!("module_layout" in have)) {
                printf "FAIL: module_layout is not exported\n"
                exit 2
              }
              exit (miss ? 1 : 0)
            }
          ' "$ref" "$symvers"

          echo "ABI gate: every kernel-required symbol is exported."
          echo "CRC mismatches above are expected and are force-loaded at runtime."

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          utc="$(date -u +%Y%m%dT%H%M%SZ)"
          zip="Satetsu-Shigure-X6882-GKI510-v5.10-satetsu-${utc}.zip"
          git clone --depth=1 -b android12-5.10 \
            https://github.com/XTENSEI/GrayRavens-anykernel.git ak3
          sed -i 's|^kernel.string=.*|kernel.string=Satetsu Shigure GKI 5.10 by Hiruko|' ak3/anykernel.sh
          cp out/arch/arm64/boot/Image ak3/Image
          rm -rf ak3/.git ak3/.github ak3/README.md
          ( cd ak3 && zip -r9 "../${zip}" . -x '*.git*' )
          sha256sum "$zip" > "${zip}.sha256"
          cat "${zip}.sha256"
          echo "ZIP=${zip}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: satetsu-shigure-gki510
          if-no-files-found: error
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
            out/arch/arm64/boot/Image
            out/vmlinux.symvers
            build.log

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v5.10-satetsu')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Built from \`${GITHUB_SHA}\` on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "- kernelrelease: \`${RELEASE}\`"
            echo "- module_layout: \`$(awk '$2=="module_layout"{print $1}' out/vmlinux.symvers)\`"
            echo "- Image bytes: $(stat -c%s out/arch/arm64/boot/Image)"
            echo
            echo "Verify before flashing:"
            echo '```'
            echo "sha256sum -c ${ZIP}.sha256"
            echo '```'
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "Satetsu Shigure (GKI 5.10 - X6882)" \
            --notes-file release-notes.md

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          if-no-files-found: ignore
          path: |
            out/.config
            out/vmlinux.symvers
            build.log
